name: Build Wormhole Proactive Test Firmware

# xiaozhi-esp32 v2.5.2 + battery monitor + one-shot proactive WakeWordInvoke test
# on chd-esp32s3-eye. Patch embedded below (base64); single board to keep run short.
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: v2.5.2 + chd-esp32s3-eye proactive test
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          fetch-depth: 0

      - name: Pin to v2.5.2
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse -q --verify "refs/tags/v2.5.2" >/dev/null; then
            git checkout -q v2.5.2
          elif git rev-parse -q --verify "refs/tags/2.5.2" >/dev/null; then
            git checkout -q 2.5.2
          else
            git checkout -q 49b4380b3faa0ceadd28a3e78aaf0f311c46c57e
          fi
          echo "Pinned to: $(git rev-parse --short HEAD)"

      - name: Apply proactive-test patch
        run: |
          echo '' | base64 -d > /tmp/proactive.patch
          git apply --verbose /tmp/proactive.patch
          git diff --stat

      - name: Build firmware (single board)
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py chd/chd-esp32s3-eye --name chd-esp32s3-eye

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-proactive-v20261126A
          path: build/merged-binary.bin
          if-no-files-found: error
