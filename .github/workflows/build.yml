name: Build Standby Fix Build Firmware

# 单板型编译：xiaozhi-esp32 v2.5.2 + 设计稿待机屏
# 补丁已内嵌在下面，不需要上传任何其他源码文件。
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: v2.5.2 + weather v20261115I
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      # 直接拉官方公开仓库，用户自己那个仓库里放不放源码都无所谓
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          fetch-depth: 0

      # tag 名在不同 fork 里可能是 v2.5.2 / 2.5.2，最后兜底到官方 release commit
      - name: Pin to v2.5.2
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse -q --verify "refs/tags/v2.5.2" >/dev/null; then
            git checkout -q v2.5.2
          elif git rev-parse -q --verify "refs/tags/2.5.2" >/dev/null; then
            git checkout -q 2.5.2
          else
            git checkout -q 49b4380b3faa0ceadd28a3e78aaf0f311c46c57e
          fi
          echo "Pinned to: $(git rev-parse --short HEAD)"

      - name: Apply standby design patch
        run: |
          echo '' | base64 -d > /tmp/standby.patch

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git apply --verbose /tmp/standby.patch
          git diff --stat

      - name: Inject weather key
        env:
          AMAP_KEY: ${{ vars.AMAP_KEY }}
        run: |
          if [ -z "$AMAP_KEY" ]; then echo "AMAP_KEY variable is missing"; exit 1; fi
          sed -i "s/__XZ_AMAP_KEY__/$AMAP_KEY/g" main/display/lcd_display.cc
          if grep -q "__XZ_AMAP_KEY__" main/display/lcd_display.cc; then echo "key injection failed"; exit 1; fi

      - name: Build firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py bread-compact-wifi-lcd --name bread-compact-wifi-lcd

      - name: Export MultiNet model files (best effort)
        continue-on-error: true
        run: |
          python - <<'PY'
          import glob, os, shutil, tarfile
          roots = glob.glob('managed_components/**/model/multinet_model', recursive=True)
          if not roots:
              roots = glob.glob('**/model/multinet_model', recursive=True)
          print('multinet roots:', roots[:5])
          out = '/tmp/xzsr'
          os.makedirs(out, exist_ok=True)
          n = 0
          for r in roots:
              for name in ('mn6_cn', 'mn6_cn_ac', 'mn7_cn', 'fst'):
                  s = os.path.join(r, name)
                  if os.path.isdir(s):
                      shutil.copytree(s, os.path.join(out, name), dirs_exist_ok=True)
                      print('added', name, 'from', s, 'files=', len(os.listdir(s)))
                      n += 1
          for s in glob.glob('**/model/fst', recursive=True):
              if os.path.isdir(s):
                  shutil.copytree(s, os.path.join(out, 'fst'), dirs_exist_ok=True)
                  print('added fst from', s)
                  n += 1
          print('model dirs collected:', n)
          if n:
              with tarfile.open('sr-models.tar.gz', 'w:gz') as t:
                  for name in sorted(os.listdir(out)):
                      t.add(os.path.join(out, name), arcname=name)
              print('tar bytes:', os.path.getsize('sr-models.tar.gz'))
          PY
      - name: Upload SR models
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-srmodels-v20261115I
          path: sr-models.tar.gz
          if-no-files-found: ignore
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-standby-v20261115I
          path: build/merged-binary.bin
          if-no-files-found: error
